# ============================================================
# AutoBroker QC — Infrastructure Docker (Production/Staging)
# Pour usage local: utiliser `npm run dev` à la racine
# ============================================================

services:
  # ---- Base de données PostgreSQL ----
  postgres:
    image: postgres:15-alpine
    container_name: autobroker-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: autobroker_db
      POSTGRES_USER: autobroker
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autobroker -d autobroker_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- Cache & File d'attente Redis ----
  redis:
    image: redis:7-alpine
    container_name: autobroker-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- Backend NestJS ----
  backend:
    build:
      context: ..
      dockerfile: apps/backend/Dockerfile
    container_name: autobroker-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://autobroker:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/autobroker_db
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379
      USE_IN_MEMORY_DB: "false"
      USE_MOCK_REDIS: "false"
      USE_MOCK_STRIPE: "false"
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:?STRIPE_SECRET_KEY is required}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:?STRIPE_WEBHOOK_SECRET is required}
      CORS_ORIGINS: ${FRONTEND_URL:-http://localhost}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ---- Frontend React (servi par Nginx) ----
  frontend:
    build:
      context: ..
      dockerfile: apps/frontend/Dockerfile
      args:
        VITE_STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:?STRIPE_PUBLISHABLE_KEY is required}
    container_name: autobroker-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_URL: ${APP_URL:-http://localhost:3001}
      VITE_STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:?STRIPE_PUBLISHABLE_KEY is required}

  # ---- Nginx Reverse Proxy ----
  nginx:
    image: nginx:alpine
    container_name: autobroker-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
